name: android-packs

on:
  workflow_dispatch:

env:
  NDK_VERSION: 28.2.13676358

jobs:
  android:
    name: ffmpeg android-${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y nasm automake autoconf libtool pkg-config patchelf
          scripts/build-android.sh "$ABI" || {
            for log in .deps-android-$ABI/.build/*/config.log; do
              [ -f "$log" ] && { echo "::group::$log"; tail -n 80 "$log"; echo "::endgroup::"; }
            done
            exit 1
          }
        env:
          ABI: ${{ matrix.abi }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: out/android-${{ matrix.abi }}
          if-no-files-found: error
          retention-days: 14
